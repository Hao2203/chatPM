[workspace]
members = [
    "crates/chat_pm_service",
    "crates/chat_pm_session",
    "crates/chat_pm_database",
    "crates/chat_pm_deepseek",
    "crates/chat_pm_sync",
    "crates/chat_pm_knowledge",
    "src-tauri"
]
resolver = "2" # Tauri 2.x 需要 resolver = "2"

[workspace.lints.clippy]
dbg_macro = "warn"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
base64ct = "1.8"
chat_pm_session = { path = "crates/chat_pm_session" }
chat_pm_database = { path = "crates/chat_pm_database" }
chat_pm_deepseek = { path = "crates/chat_pm_deepseek" }
chat_pm_service = { path = "crates/chat_pm_service" }
chat_pm_sync = { path = "crates/chat_pm_sync" }
chat_pm_knowledge = { path = "crates/chat_pm_knowledge" }
chrono = { version = "0.4", features = ["serde"] }
derive_more = { version = "2", features = ["from", "into", "as_ref"] }
distributed-topic-tracker = "0.3"
dotenvy = "0.15"
ed25519-dalek = "3.0.0-pre.6"
iroh-blobs = "0.100"
futures-lite = "2.6"
logforth = { version = "0.29", features = ["bridge-log", "layout-text"] }
tracing = { version = "0.1", features = ["log"] }
http = { version = "1" }
iroh = { version = "0.98", features = ["address-lookup-mdns"] }
iroh-gossip = "0.98"
rusqlite = { version = "0.37", features = ["bundled", "uuid"] }
reqwest = { version = "0.13", features = ["json", "stream"] }
secrecy = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = { version = "2" }
tokio = { version = "1", features = [] }
uuid = { version = "1", features = ["serde", "v7", "v4"] }
